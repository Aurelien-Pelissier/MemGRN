[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memgrn"
version = "0.1.0"
description = "MemGRN: Learning Regulatory Dynamics with Explicit Weights and Adaptive Memory"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Aurélien Pélissier", email = "aurelien.pelissier.38@gmail.com"},
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "jax>=0.4.25",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
